<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="v3-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="v3-dock" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Terminal Body with Bottom Cradle Combined -->
  <rect x="24" y="32" width="208" height="192" rx="36" fill="url(#v3-dark)" stroke="#334155" stroke-width="8"/>

  <!-- Terminal Prompt >_ -->
  <path d="M 64 88 L 108 120 L 64 152" stroke="#10B981" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="132" y1="152" x2="184" y2="152" stroke="#38BDF8" stroke-width="18" stroke-linecap="round"/>

  <!-- Bottom Integrated Dock Bar -->
  <path d="M 32 176 L 224 176 L 224 192 C 224 212 208 228 188 228 L 68 228 C 48 228 32 212 32 192 Z"
        fill="url(#v3-dock)"/>

  <!-- Service Activity Indicators on Dock Bar -->
  <circle cx="72" cy="202" r="8" fill="#10B981"/>
  <circle cx="98" cy="202" r="8" fill="#FFFFFF"/>
  <circle cx="124" cy="202" r="8" fill="#0284C7"/>
  <!-- Caret icon -->
  <path d="M 180 206 L 190 196 L 200 206" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>